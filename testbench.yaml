# Try it by hand (Docker): bash scripts/plugin-php.sh filament-activity-log-plus bash
#   vendor/bin/testbench workbench:build
#   vendor/bin/testbench filament:assets
#   ACTIVITY_LOG_PLUS_REVERT=true vendor/bin/testbench serve --host=0.0.0.0 --port=8000
# Sign in at /admin as emma@example.com / password; the log is at /admin/activity-log/activity-logs.
# Revert / Restore is OFF by default: the ACTIVITY_LOG_PLUS_REVERT variable above turns it on and the workbench
# panel then defines the gates for the demo. After `workbench:build`, delete vendor/orchestra/testbench-core/laravel/.env
# before running phpunit (it sets CACHE_STORE=database).
providers:
  - Filament\Actions\ActionsServiceProvider
  - Spatie\Activitylog\ActivitylogServiceProvider
  - BladeUI\Heroicons\BladeHeroiconsServiceProvider
  - BladeUI\Icons\BladeIconsServiceProvider
  - Filament\FilamentServiceProvider
  - Filament\Forms\FormsServiceProvider
  - Filament\Infolists\InfolistsServiceProvider
  - Livewire\LivewireServiceProvider
  - Filament\Notifications\NotificationsServiceProvider
  - Spatie\MediaLibrary\MediaLibraryServiceProvider
  - Spatie\Permission\PermissionServiceProvider
  - Filament\Schemas\SchemasServiceProvider
  - Filament\Support\SupportServiceProvider
  - Filament\Tables\TablesServiceProvider
  - Filament\Widgets\WidgetsServiceProvider
  - RyanChandler\BladeCaptureDirective\BladeCaptureDirectiveServiceProvider
  - Asignua\FilamentActivityLogPlus\ActivityLogPlusServiceProvider
  - Workbench\App\Providers\AdminPanelProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DemoSeeder

env:
  APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
  DB_CONNECTION: sqlite
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  CACHE_STORE: array

workbench:
  start: /admin
  install: true
  discovers:
    web: false
    api: false
    commands: false
    components: false
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    - db-seed
  assets:
    - laravel-assets
  sync: []
